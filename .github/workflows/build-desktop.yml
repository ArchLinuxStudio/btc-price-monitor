name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
            rust-targets: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu --bundles appimage,deb"
            rust-targets: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            rust-targets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
            rust-targets: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript tooling
        run: npm ci

      - name: Run parser tests
        run: npm test

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: .
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "crypto-top-[platform]-[arch]-[bundle]"
