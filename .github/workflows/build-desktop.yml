name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
            rust-targets: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu --bundles appimage,deb"
            rust-targets: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            rust-targets: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
            rust-targets: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend tooling
        run: npm ci

      - name: Run frontend checks
        run: npm run check

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: .
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "crypto-top-[platform]-[arch]-[bundle]"

  release:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download desktop bundles
        uses: actions/download-artifact@v8
        with:
          pattern: crypto-top-*
          path: workflow-artifacts

      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          if [[ "${version}" != "${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

          mkdir -p release-assets

          copy_one() {
            artifact_dir="$1"
            file_pattern="$2"
            destination="$3"
            source_file="$(find "workflow-artifacts/${artifact_dir}" -type f -name "${file_pattern}" -print -quit)"

            if [[ -z "${source_file}" ]]; then
              echo "Missing ${file_pattern} in ${artifact_dir}" >&2
              exit 1
            fi

            cp "${source_file}" "release-assets/${destination}"
          }

          copy_one "crypto-top-windows-x64-nsis" "*.exe" "Crypto.Top_${version}_x64-setup.exe"
          copy_one "crypto-top-linux-amd64-appimage" "*.AppImage" "Crypto-Top_${version}_linux-amd64.AppImage"
          copy_one "crypto-top-linux-amd64-deb" "*.deb" "Crypto-Top_${version}_linux-amd64.deb"
          copy_one "crypto-top-darwin-aarch64-dmg" "*.dmg" "Crypto-Top_${version}_macos-aarch64.dmg"
          copy_one "crypto-top-darwin-x64-dmg" "*.dmg" "Crypto-Top_${version}_macos-x64.dmg"

          sha256sum release-assets/*

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "Crypto Top ${GITHUB_REF_NAME}"
          fi

          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
