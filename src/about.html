<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>关于 Crypto Top</title>
    <link rel="stylesheet" href="about.css" />
    <script type="module" src="./about.js"></script>
  </head>
  <body>
    <main class="about-shell" aria-labelledby="app-name">
      <section class="identity-card" aria-label="应用概览">
        <img class="app-icon" src="app-icon.svg" alt="Crypto Top 应用图标" width="62" height="62" />

        <div class="identity-copy">
          <h1 id="app-name">Crypto Top</h1>
          <p class="version">版本 <strong id="app-version">{{APP_VERSION}}</strong></p>
        </div>

        <button
          id="repository-link"
          class="github-link"
          type="button"
          aria-label="在 GitHub 上打开 Crypto Top 仓库"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.69-1.29-1.69-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.57-.29-5.28-1.29-5.28-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.78 1.06.78 2.14v3.18c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"
            />
          </svg>
        </button>
      </section>

      <section class="license-card" aria-labelledby="license-heading">
        <div class="license-header">
          <span class="license-badge" aria-hidden="true">GPL</span>
          <div>
            <h2 id="license-heading">开源许可</h2>
            <p class="license-name">GNU GPL v3.0</p>
          </div>
        </div>
        <p class="license-note">
          SPDX: GPL-3.0-only。本软件按“原样”提供，不附带任何明示或默示担保。
        </p>
      </section>

      <span class="repository-status" id="repository-status" role="status" aria-live="polite"></span>
      <p class="copyright">Copyright © 2026 Crypto Top contributors</p>
    </main>
  </body>
</html>
