<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Crypto Top</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="monitor" aria-label="加密货币与美股相关合约实时行情监视器">
      <header class="titlebar">
        <div class="drag-zone" data-tauri-drag-region="deep">
          <div class="connection" data-tauri-drag-region="deep">
            <span class="live-dot is-connecting" id="live-dot" aria-hidden="true"></span>
            <span class="status-text" id="status-text" role="status" aria-live="polite">LINK</span>
            <span class="market-label" id="market-label" aria-label="美元计价">USD</span>
            <span class="source-label" id="source-label" aria-label="等待行情来源">Coinbase</span>
          </div>
          <span aria-hidden="true"></span>
          <span class="baseline-label" aria-label="涨跌幅以 UTC+0 当天 00:00 的价格为基准">Δ UTC+0</span>
          <span class="sr-only" id="update-time">等待首笔行情</span>
        </div>

        <div class="window-controls" aria-label="窗口控制">
          <button
            id="watchlist-button"
            type="button"
            aria-label="添加或管理自选品种"
            aria-controls="watchlist-manager"
            aria-expanded="false"
          >
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path class="watchlist-plus" d="M6 2v8M2 6h8" />
              <path class="watchlist-back" d="M8.5 2.5 5 6l3.5 3.5M5 6h5" />
            </svg>
          </button>
          <button id="close-button" class="close" type="button" aria-label="隐藏到系统托盘">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 2.5 7 7m0-7-7 7" /></svg>
          </button>
        </div>
      </header>

      <section class="quotes" id="quotes" aria-label="自选品种实时价格"></section>

      <section
        class="watchlist-manager"
        id="watchlist-manager"
        role="dialog"
        aria-label="管理自选品种"
        hidden
      >
        <div class="search-track">
          <svg class="search-icon" viewBox="0 0 12 12" aria-hidden="true">
            <circle cx="5" cy="5" r="3.25" />
            <path d="m7.5 7.5 2.25 2.25" />
          </svg>
          <input
            id="coin-search"
            type="search"
            inputmode="search"
            autocomplete="off"
            spellcheck="false"
            maxlength="30"
            placeholder="搜索币种 / 美股"
            aria-label="按代码或名称搜索 USD 现货或美股相关 USDT 永续合约"
          />
        </div>
        <div class="manager-list" id="manager-list"></div>
      </section>

      <span class="sr-only" id="manager-status" role="status" aria-live="polite"></span>

      <template id="quote-row-template">
        <article class="quote-row">
          <div class="asset">
            <span class="asset-marker" aria-hidden="true"></span>
            <strong></strong>
          </div>
          <span class="price">—</span>
          <span class="change neutral">—</span>
        </article>
      </template>
    </main>
  </body>
</html>
