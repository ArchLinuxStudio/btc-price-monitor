<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Crypto Top</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="monitor" aria-label="BTC 和 ETH 美元实时价格监视器">
      <header class="titlebar">
        <div class="drag-zone" data-tauri-drag-region="deep">
          <div class="connection" data-tauri-drag-region="deep">
            <span class="live-dot is-connecting" id="live-dot" aria-hidden="true"></span>
            <span class="status-text" id="status-text" role="status" aria-live="polite">LINK</span>
            <span class="market-label">USD</span>
            <span class="source-label" id="source-label" title="Coinbase + Kraken">Coinbase</span>
          </div>
          <span aria-hidden="true"></span>
          <span class="baseline-label" title="涨跌幅以 UTC+0 当天 00:00 的价格为基准">Δ UTC+0</span>
          <span class="sr-only" id="update-time">等待首笔行情</span>
        </div>

        <div class="window-controls" aria-label="窗口控制">
          <button id="minimize-button" type="button" title="隐藏到系统托盘" aria-label="隐藏到系统托盘">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5h8" /></svg>
          </button>
          <button id="close-button" class="close" type="button" title="隐藏到系统托盘；退出请右键托盘图标" aria-label="隐藏到系统托盘">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 2.5 7 7m0-7-7 7" /></svg>
          </button>
        </div>
      </header>

      <section class="quotes" aria-label="实时价格">
        <article class="quote-row" id="btc-row">
          <div class="asset">
            <span class="asset-marker btc" aria-hidden="true"></span>
            <strong>BTC</strong>
          </div>
          <span class="price" id="btc-price">—</span>
          <span class="change neutral" id="btc-change" title="相对当天 00:00 UTC">—</span>
        </article>

        <article class="quote-row" id="eth-row">
          <div class="asset">
            <span class="asset-marker eth" aria-hidden="true"></span>
            <strong>ETH</strong>
          </div>
          <span class="price" id="eth-price">—</span>
          <span class="change neutral" id="eth-change" title="相对当天 00:00 UTC">—</span>
        </article>
      </section>
    </main>
  </body>
</html>
