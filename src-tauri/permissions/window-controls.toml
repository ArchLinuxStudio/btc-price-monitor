[[permission]]
identifier = "allow-window-controls"
description = "Allows the bundled monitor window to minimize, close, resize its compact layout or bounded quote height, and reassert always-on-top mode."
commands.allow = [
  "minimize_window",
  "close_window",
  "ensure_always_on_top",
  "set_monitor_layout",
  "resize_monitor_height",
]
