[package]
name = "crypto-top-monitor"
version = "1.7.0"
description = "Always-on-top BTC and ETH USD price monitor"
authors = ["Crypto Top contributors"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "crypto_top_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "network", "component"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
wmi = { version = "0.18.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10"

[dev-dependencies]
plist = "1.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
